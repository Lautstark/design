<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <!-- The family's bubble, in all three hues at once.

       Every product fills this same path with its own accent, and the accent is
       what tells them apart. This repository is not a product and so has no hue
       of its own; it has the set. Hard stops rather than a blend, because the
       rule is that the hues stay distinct. -->
  <defs>
    <linearGradient id="hues" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#ff6b35"/>
      <stop offset=".333" stop-color="#ff6b35"/>
      <stop offset=".333" stop-color="#ff8bc7"/>
      <stop offset=".667" stop-color="#ff8bc7"/>
      <stop offset=".667" stop-color="#9B7BFF"/>
      <stop offset="1"    stop-color="#9B7BFF"/>
    </linearGradient>
  </defs>

  <path
    d="M 128 76 H 384 Q 436 76 436 128 V 272 Q 436 324 384 324 H 314 L 256 408 L 198 324 H 128 Q 76 324 76 272 V 128 Q 76 76 128 76 Z"
    fill="url(#hues)"
  />

  <circle cx="200" cy="178" r="22" fill="white" />
  <circle cx="312" cy="178" r="22" fill="white" />

  <path
    d="M 190 226 C 190 288 322 288 322 226"
    fill="none"
    stroke="white"
    stroke-width="26"
    stroke-linecap="round"
  />
</svg>
