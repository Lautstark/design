name: check

# Two jobs, and they are separate on purpose.
#
# The audit is the generator and the token sets, and it installs nothing —
# build.js has no dependencies, which is the property the three products are
# protecting when they pin this package. Adding a test runner must not quietly
# cost that, so the runner lives in the second job and the first still proves
# the generator runs on a bare node.
#
# Catching either kind of regression here costs one red tick; catching it after
# a tag has gone out and three products have pinned it costs three bumps.

on:
  push:
    branches: [main]
    # A tag is the release artifact for this package — the three products pin
    # `#v1.18.0` and resolve against these — so tags get the same gate as main.
    # The paragraph above costs out a regression that reaches a tag; this is
    # the line that makes the tag itself a thing that can be caught.
    tags: ['v*']
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Fail before anything else if the tag and package.json disagree. The
      # products resolve a pin against the tag but read the version out of
      # package.json once installed, so a mismatch ships a package that lies
      # about which release it is — and `pins.js`, which is how the products
      # find out they are behind, compares those same two things.
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg="v$(npm pkg get version | tr -d '"')"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME but package.json says $pkg"
            exit 1
          fi
          echo "$GITHUB_REF_NAME matches package.json"

      # No install step: the generator has no dependencies, which is the same
      # property the products are protecting.
      - run: node build.js --check

      # tokens/ is committed and consumers read it straight off the package, so a
      # stale commit would ship stale values. There is no `prepare` script to
      # regenerate them on install, deliberately — this family allowlists install
      # scripts, and a token set that is static CSS has no business running code
      # on someone else's machine. This check is what replaces it.
      - name: Are the committed tokens current?
        run: |
          node build.js
          git diff --exit-code tokens/ || {
            echo "::error::tokens/ is stale. Run 'node build.js' and commit the result."
            exit 1
          }

  # docs/lib/'s five behaviour modules: ./menu, ./dialog, ./rename, ./toast
  # and ./collections. Each exists because three products got the same thing subtly
  # wrong, and a change to one of them lands in all three at once behind a tag —
  # which is the whole reason they are worth a runner and the colour maths is
  # not the only thing checked here any more.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # Only devDependencies: nothing here ships. The published package still
      # has no dependencies of its own, and `files` does not carry tests/.
      - run: npm ci

      - run: npm test
