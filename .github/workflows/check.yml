name: check

# The audit, on every change to the generator or to a product's declaration.
# Catching a contrast regression here costs one red tick; catching it after the
# sync has opened three pull requests costs three.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No install step: the generator has no dependencies, which is the same
      # property the products are protecting.
      - run: node build.js --check

      # tokens/ is committed and consumers read it straight off the package, so a
      # stale commit would ship stale values. There is no `prepare` script to
      # regenerate them on install, deliberately — this family allowlists install
      # scripts, and a token set that is static CSS has no business running code
      # on someone else's machine. This check is what replaces it.
      - name: Are the committed tokens current?
        run: |
          node build.js
          git diff --exit-code tokens/ || {
            echo "::error::tokens/ is stale. Run 'node build.js' and commit the result."
            exit 1
          }
